<title>Navalha Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra de vidro fixa com logo e troca de perfil (Cliente / Barbeiro / Gerente); cada perfil tem abas próprias; tema escuro único, tirado da logo: preto, carmim e dourado */
:root{
  color-scheme:dark;
  --bg:#09090B; --bg2:#101014; --card:#16161B; --card2:#1D1D24; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#F4EFE7; --muted:#9A948B; --dim:#6B665F;
  --red:#E0262F; --red-deep:#8C0F16; --red-glow:rgba(224,38,47,.35);
  --gold:#F0BD4F; --gold-deep:#A8761E; --gold-glow:rgba(240,189,79,.28);
  --chrome:#B9C6D3;
  --ok:#3CC97E; --warn:#FF8A2B; --off:#6E6A64;
  --f-display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(224,38,47,.16),transparent 60%),radial-gradient(700px 420px at -10% 10%,rgba(240,189,79,.08),transparent 60%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:var(--red);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(9,9,11,.85)}

/* ---------- topo ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;
  background:rgba(9,9,11,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--red) 30%,var(--gold) 70%,transparent);opacity:.6}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 0 18px var(--red-glow)}
.brand b{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1}
.roles{margin-left:auto;display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;position:relative}
.roles button{position:relative;z-index:1;background:none;border:0;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);transition:color .2s}
.roles button[aria-pressed="true"]{color:#fff}
.roles .thumb{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:9px;background:linear-gradient(135deg,var(--red),var(--red-deep));box-shadow:0 4px 16px var(--red-glow);transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1)}
.ghostlink{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:9px;padding:6px 10px;cursor:pointer;font-size:12px}
.ghostlink:hover{color:var(--ink);border-color:var(--gold)}
@media (max-width:600px){.roles{order:3;width:100%;margin-left:0}.roles button{flex:1}.ghostlink{margin-left:auto}.wday .lbl{display:none}}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(34px,5vw,52px);font-weight:900;line-height:.95;text-transform:uppercase}
h2{font-size:26px;font-weight:800;text-transform:uppercase;line-height:1}
h3{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gold-text{background:linear-gradient(100deg,var(--gold-deep) 0%,var(--gold) 35%,#FFE7A8 50%,var(--gold) 65%,var(--gold-deep) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;border:0;border-radius:11px;padding:11px 20px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px var(--red-glow);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px var(--red-glow)}
.btn:active{transform:translateY(0)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-120%)}
.btn:hover::after{transform:translateX(120%);transition:transform .7s}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1B1203;box-shadow:0 6px 20px var(--gold-glow)}
.btn.ghost{background:transparent;border:1px solid var(--line2);box-shadow:none;color:var(--ink)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;min-width:0}
input.i,select.i{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;color:var(--ink);min-width:0;width:100%;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;transition:border-color .15s,box-shadow .15s}
input.i:focus,select.i:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--gold-deep);padding-left:10px;margin:0}
.err{color:#FF6B70;font-weight:600;margin:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:12px 16px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;font-size:14px;letter-spacing:.02em}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);text-shadow:0 0 18px var(--red-glow)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-deep)}

/* ---------- entrada animada ---------- */
@media (prefers-reduced-motion:no-preference){
  .enter > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .enter > *:nth-child(2){animation-delay:.05s}.enter > *:nth-child(3){animation-delay:.1s}.enter > *:nth-child(4){animation-delay:.15s}.enter > *:nth-child(5){animation-delay:.2s}
  .stagger > *{animation:pop .35s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 22ms)}
  .gold-text{animation:shine 6s linear infinite}
  .halo{animation:spin 14s linear infinite}
  .pulse{animation:pulse 2s ease-in-out infinite}
}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.001;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--red-glow)}50%{box-shadow:0 0 0 8px transparent}}

/* ---------- cliente ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-bottom:28px}
.logo-wrap{position:relative;width:150px;height:150px;flex:none}
.logo-wrap img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.halo{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--red),var(--gold),var(--red-deep),var(--gold),var(--red));filter:blur(10px);opacity:.55}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.logo-wrap{width:120px;height:120px}}
.client{max-width:760px;margin:0 auto}
.progress{display:flex;gap:6px;margin:0 0 22px}
.progress div{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.progress span{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;position:relative}
.progress span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--red),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.progress .on{color:var(--ink)}.progress .on span::after{transform:scaleX(1)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.choice{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.choice::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 120px at var(--mx,50%) var(--my,0%),rgba(240,189,79,.14),transparent 60%);opacity:0;transition:opacity .2s}
.choice:hover{transform:translateY(-3px);border-color:var(--gold-deep);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.choice:hover::before{opacity:1}
.choice[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 12px 30px var(--red-glow)}
.choice b{font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.choice .price{font-family:var(--f-mono);color:var(--gold);font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:20px;background:linear-gradient(135deg,var(--red),var(--red-deep));box-shadow:0 0 0 2px var(--gold-deep);margin-bottom:6px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.day{flex:0 0 68px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.day:hover{transform:translateY(-2px);border-color:var(--gold-deep)}
.day small{display:block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}
.day b{font-family:var(--f-display);font-size:28px;font-weight:900;line-height:1.1}
.day[aria-pressed="true"]{background:linear-gradient(160deg,var(--red),var(--red-deep));border-color:var(--red);box-shadow:0 8px 20px var(--red-glow)}
.day[aria-pressed="true"] small{color:#fff;opacity:.85}
.day:disabled{opacity:.3;cursor:not-allowed;transform:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 0;cursor:pointer;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;transition:all .15s}
.slot:hover{border-color:var(--gold);color:var(--gold)}
.slot[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1B1203;border-color:var(--gold);box-shadow:0 6px 18px var(--gold-glow)}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.ticket{position:relative;border-radius:18px;padding:26px;background:linear-gradient(160deg,#1E1416,#121216 60%);border:1px solid var(--line2);overflow:hidden}
.ticket::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--red-glow),transparent 70%)}
.ticket .check{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1B1203;font-size:28px;font-weight:900;box-shadow:0 0 30px var(--gold-glow)}

/* ---------- agenda geral (grade) ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
.grid{display:grid;min-width:640px;position:relative}
.grid-head{display:contents}
.grid-head > div{position:sticky;top:0;padding:12px 10px;border-bottom:1px solid var(--line);background:var(--card);z-index:2;display:flex;align-items:center;gap:8px;font-weight:700}
.grid-head .avatar{width:28px;height:28px;font-size:14px;margin:0;box-shadow:0 0 0 1px var(--gold-deep)}
.hours-col{position:relative;border-right:1px solid var(--line)}
.hours-col span{position:absolute;right:6px;font-family:var(--f-mono);font-size:11px;color:var(--dim);transform:translateY(-50%)}
.barber-col{position:relative;border-right:1px solid var(--line)}
.barber-col:last-child{border-right:0}
.hline{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.04)}
.closed{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(255,255,255,.03) 7px 9px)}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--red);z-index:3;box-shadow:0 0 10px var(--red)}
.nowline::before{content:"";position:absolute;left:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.appt{position:absolute;left:5px;right:5px;border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.25;cursor:pointer;overflow:hidden;border:0;border-left:3px solid;text-align:left;z-index:1;transition:transform .15s,box-shadow .15s}
.appt:hover{transform:scale(1.02);z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.appt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.st-scheduled{background:rgba(185,198,211,.12);border-color:var(--chrome);color:var(--ink)}
.st-completed{background:rgba(60,201,126,.13);border-color:var(--ok);color:var(--ink)}
.st-no_show{background:rgba(255,138,43,.14);border-color:var(--warn);color:var(--ink)}
.st-canceled{background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px);border-color:var(--off);color:var(--dim);text-decoration:line-through}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.scheduled{color:var(--chrome)}.pill.completed{color:var(--ok)}.pill.no_show{color:var(--warn)}.pill.canceled{color:var(--off)}

/* ---------- agenda do barbeiro (linha do tempo) ---------- */
.barber-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
@media (max-width:700px){.barber-head{grid-template-columns:1fr}}
.next{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:var(--r);background:linear-gradient(120deg,rgba(224,38,47,.22),rgba(240,189,79,.08));border:1px solid rgba(224,38,47,.4)}
.next .t{font-family:var(--f-display);font-size:44px;font-weight:900;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s;min-width:0}
.wday:hover{border-color:var(--gold-deep);transform:translateY(-2px)}
.wday small{display:block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;color:var(--muted)}
.wday b{font-family:var(--f-display);font-size:22px;font-weight:900}
.wday .bar{height:3px;border-radius:2px;background:var(--line2);margin:6px 8px 0;overflow:hidden}
.wday .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.wday[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.timeline{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:72px}
.timeline::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--red),var(--gold-deep),transparent)}
.tl{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.tl:hover{border-color:var(--line2);transform:translateX(2px)}
.tl .time{position:absolute;left:-72px;top:14px;width:50px;text-align:right;font-family:var(--f-mono);font-weight:600;font-size:13px}
.tl::before{content:"";position:absolute;left:-19px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--chrome)}
.tl.completed::before{border-color:var(--ok);background:var(--ok)}
.tl.no_show::before{border-color:var(--warn)}
.tl.canceled{opacity:.55}.tl.canceled::before{border-color:var(--off)}
.tl.now{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 10px 30px var(--red-glow)}
.tl.now::before{background:var(--red);border-color:var(--red)}
.tl .who{font-weight:700;font-size:16px}
.tl .what{color:var(--muted);font-size:13px}
.tl.free{background:transparent;border:1px dashed var(--line2);cursor:pointer;color:var(--muted);grid-template-columns:1fr auto}
.tl.free:hover{border-color:var(--gold);color:var(--gold)}
.tl.free::before{border-style:dashed;border-color:var(--dim)}
.tl .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.tl{grid-template-columns:1fr}.tl .acts{justify-content:flex-start}}
.mini{background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.mini.ok:hover{border-color:var(--ok);color:var(--ok)}
.mini.warn:hover{border-color:var(--warn);color:var(--warn)}
.mini.off:hover{border-color:var(--off);color:var(--off)}

/* ---------- números ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi .v{font-family:var(--f-display);font-size:clamp(22px,2.4vw,32px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero-k{border-color:rgba(240,189,79,.4);background:linear-gradient(160deg,rgba(240,189,79,.12),var(--card) 70%)}
.kpi.hero-k::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--gold-glow),transparent 70%)}
.chart svg{width:100%;height:auto;display:block}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.member{display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:transform .2s,border-color .2s}
.member:hover{transform:translateY(-3px);border-color:var(--gold-deep)}
.member .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.member .stats div{background:var(--bg2);border-radius:10px;padding:8px 10px}
.member .stats b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800}
.member .stats small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.meter{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(255,255,255,.025)}
td input.i{padding:7px 9px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.hist-day{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:14px 0 6px}
.hrow{display:grid;grid-template-columns:56px 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin-bottom:6px}
@media (max-width:560px){.hrow{grid-template-columns:48px 1fr auto}.hrow .pill{grid-column:2}}

.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:linear-gradient(180deg,var(--card2),var(--bg2));border-left:1px solid var(--line2);width:min(440px,100%);height:100%;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .35s cubic-bezier(.2,.8,.2,1)}}
@keyframes slide{from{transform:translateX(40px);opacity:.001}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold-deep);color:var(--ink);padding:11px 18px;border-radius:12px;z-index:30;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .3s both}}
.who-pick{display:flex;gap:8px;flex-wrap:wrap}
.who-pick button{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 5px;cursor:pointer;font-weight:700;transition:border-color .15s}
.who-pick .avatar{width:30px;height:30px;font-size:15px;margin:0}
.who-pick button[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

/* ---------- WhatsApp ---------- */
.tabcount{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--gold);color:#1B1203;font-size:11px;font-weight:800;margin-left:6px;vertical-align:1px}
.wa{--wa-bg:#0B141A;--wa-head:#202C33;--wa-in:#202C33;--wa-out:#005C4B;--wa-ink:#E9EDEF;--wa-dim:#8696A0;--wa-link:#53BDEB;
  background:var(--wa-bg);border-radius:18px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.5);color:var(--wa-ink);font-family:var(--f-body);font-size:14px;max-width:380px;width:100%}
.wa-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--wa-head)}
.wa-head img{width:34px;height:34px;border-radius:50%}
.wa-head b{display:block;font-size:15px}.wa-head small{color:var(--wa-dim);font-size:12px}
.wa-body{padding:14px 12px 16px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.02) 0 2px,transparent 3px) 0 0/22px 22px,var(--wa-bg)}
.wa-day{align-self:center;background:#182229;color:var(--wa-dim);font-size:11px;padding:4px 10px;border-radius:7px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.wa-msg{position:relative;align-self:flex-start;max-width:88%;background:var(--wa-in);padding:7px 10px 18px;border-radius:0 9px 9px 9px;line-height:1.4}
.wa-msg.out{align-self:flex-end;background:var(--wa-out);border-radius:9px 0 9px 9px}
.wa-time{position:absolute;right:8px;bottom:3px;font-size:10.5px;color:var(--wa-dim)}
.wa-msg.out .wa-time{color:#8BD3C7}
.wa-btns{align-self:flex-start;width:88%;display:flex;flex-direction:column;gap:3px;margin-top:-2px}
.wa-btns button,.wa-btns span{background:var(--wa-in);border:0;color:var(--wa-link);padding:9px;border-radius:8px;font-weight:600;text-align:center;font-size:14px}
.wa-btns button{cursor:pointer}.wa-btns button:hover{background:#2A3942}
.wa-btns span{opacity:.6}
.wa-tag{font-family:var(--f-mono);font-size:10px;color:var(--wa-dim);align-self:center;margin-top:6px}
.rm{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.rm.confirmed{background:rgba(60,201,126,.14);color:var(--ok)}
.rm.reschedule{background:rgba(255,138,43,.16);color:var(--warn)}
.rm.sent{background:rgba(185,198,211,.12);color:var(--chrome)}
.rm.pending{background:rgba(255,255,255,.05);color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;counter-reset:f}
.flow div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);counter-increment:f}
.flow div::before{content:counter(f);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;font-weight:800;font-size:12px;margin-right:8px}
.flow b{color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp div{background:var(--bg2);border-radius:12px;padding:14px}
.cmp b{display:block;font-family:var(--f-display);font-size:34px;font-weight:900;line-height:1}
.wa-link{display:inline-flex;align-items:center;gap:6px;background:#00A884;color:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;text-decoration:none}
.wa-link:hover{background:#06CF9C}

/* ---------- v5: novos componentes ---------- */
.only-mob{display:none}
@media (max-width:700px){.only-desk{display:none!important}.only-mob{display:block}}
.client-nav{display:flex;justify-content:center;margin-bottom:22px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
.filters label.f{flex:1 1 150px}
.filters select.i{padding:8px 10px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(240,189,79,.12);color:var(--gold);border:1px solid rgba(240,189,79,.3)}
.delta{font-family:var(--f-mono);font-size:12px;font-weight:600}
.delta.up{color:var(--ok)}.delta.down{color:#FF6B70}.delta.flat{color:var(--muted)}
.heat{display:grid;gap:3px;font-family:var(--f-mono);font-size:11px}
.heat .h{color:var(--dim);text-align:center;padding-bottom:2px}
.heat .d{color:var(--muted);display:flex;align-items:center;text-transform:uppercase}
.heat .c{aspect-ratio:1.5/1;border-radius:5px;display:grid;place-items:center;color:rgba(255,255,255,.92);font-weight:600;font-size:10px;min-width:0}
.heat-scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px}
.heat-scale i{width:80px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(224,38,47,.12),var(--red),var(--gold))}
.tl.block{background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 8px,transparent 8px 16px);border-style:dashed;border-color:var(--line2)}
.tl.block::before{border-color:var(--dim);background:var(--dim)}
.blk{position:absolute;left:5px;right:5px;border-radius:8px;padding:5px 8px;font-size:11px;color:var(--muted);background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,rgba(255,255,255,.015) 6px 12px);border:1px dashed var(--line2);overflow:hidden;z-index:1}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.tgl{position:relative;width:44px;height:24px;flex:none}
.tgl input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.tgl span{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:background .2s}
.tgl span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s}
.tgl input:checked + span{background:linear-gradient(135deg,var(--red),var(--red-deep))}
.tgl input:checked + span::after{transform:translateX(20px)}
.tgl input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer}
.check-row input{margin-top:3px;accent-color:var(--red);width:16px;height:16px;flex:none}
details.priv{font-size:13px;color:var(--muted)}
details.priv summary{cursor:pointer;color:var(--gold);font-weight:600}
details.priv p{margin:8px 0 0}
.appt-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.appt-card .date{width:64px;text-align:center;border-radius:12px;padding:8px 0;background:linear-gradient(160deg,var(--red),var(--red-deep))}
.appt-card .date small{display:block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;opacity:.85}
.appt-card .date b{font-family:var(--f-display);font-size:30px;font-weight:900;line-height:1}
.cl-row{display:grid;grid-template-columns:minmax(0,1.6fr) 70px minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.cl-row:hover{border-color:var(--line2)}
.cl-head{display:grid;grid-template-columns:minmax(0,1.6fr) 70px minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:0 12px 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
@media (max-width:700px){.cl-row{grid-template-columns:1fr auto}.cl-row .hide-sm,.cl-head{display:none}}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.inativo{background:rgba(255,138,43,.15);color:var(--warn)}
.tag.novo{background:rgba(185,198,211,.14);color:var(--chrome)}
.tag.fiel{background:rgba(240,189,79,.14);color:var(--gold)}
.tag.ativo{background:rgba(60,201,126,.12);color:var(--ok)}
textarea.i{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--ink);width:100%;min-height:72px;resize:vertical;font:inherit;font-size:14px}
textarea.i:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.warnbox{border:1px solid rgba(255,138,43,.4);background:rgba(255,138,43,.08);border-radius:12px;padding:12px 14px;font-size:14px}
.mob-agenda .barber-block{margin-bottom:16px}
.mob-agenda .barber-block h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mob-agenda .mi{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;margin-bottom:5px;border-left:3px solid;cursor:pointer;font-size:14px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:12px}.kpi .v{font-size:21px}.kpi .s{font-size:11px}.switch-row{flex-wrap:wrap}.filters label.f{flex:1 1 130px}}
.two > *{min-width:0}

const shift=ms=>new Date(ms+OFFSET_MIN*60000);
const dayKey=ms=>shift(ms).toISOString().slice(0,10);
const localMin=ms=>{const d=shift(ms);return d.getUTCHours()*60+d.getUTCMinutes();};
const weekday=k=>(new Date(k+"T00:00:00Z").getUTCDay()+6)%7;
const toUtc=(k,m)=>Date.parse(k+"T00:00:00Z")+m*60000-OFFSET_MIN*60000;
const addDays=(k,n)=>new Date(Date.parse(k+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);
const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const parseHM=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(t).trim());return m?+m[1]*60+ +m[2]:null;};
const brl=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=v=>(v*100).toFixed(1).replace(".",",")+"%";
const fmtDay=k=>{const[,m,d]=k.split("-").map(Number);return `${WD_LONG[weekday(k)]}, ${d} de ${MES[m-1]}`;};
const shortDay=k=>{const[,m,d]=k.split("-").map(Number);return `${WD[weekday(k)]} ${d}/${String(m).padStart(2,"0")}`;};
const brDate=k=>k.split("-").reverse().join("/");
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>dayKey(Date.now());
function normalizePhone(raw){let d=String(raw).replace(/\D+/g,"");if(d.startsWith("55")&&(d.length===12||d.length===13))d=d.slice(2);return(d.length===10||d.length===11)?"+55"+d:null;}
const fmtPhone=e=>{if(!/^\+55\d{10,11}$/.test(e||""))return "—";const d=e.slice(3);return `(${d.slice(0,2)}) ${d.length===11?d.slice(2,7)+"-"+d.slice(7):d.slice(2,6)+"-"+d.slice(6)}`;};
const initial=n=>(n||"?").trim().charAt(0).toUpperCase();
const first=n=>(n||"").split(" ")[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(m){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

/* ================= estado ================= */
const KEY="navalha-proto-v9";
let S=lsGet(KEY);
const save=()=>lsSet(KEY,S);
const barber=id=>S.barbers.find(b=>b.id===id);
const activeBarbers=()=>S.barbers.filter(b=>b.active);
const cidOf=phone=>S.shop.slug+"_"+phone;
/* Conta do cliente: telefone + senha. No protótipo a senha vira um hash simples (cyrb53 com o telefone como sal).
   No sistema real quem guarda a senha é o Firebase Auth (e-mail interno 55DDDNUMERO@clientes.navalha.app). */
const hashPw=(pw,salt)=>{let h1=0xdeadbeef^salt.length,h2=0x41c6ce57;const t=salt+":"+pw;for(let i=0;i<t.length;i++){const ch=t.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36);};
let SESSION=lsGet("navalha-session");
const sessionClient=()=>{const c=SESSION&&S.clients[cidOf(SESSION)];return c&&c.pass?c:null;};
function login(phone){SESSION=phone;lsSet("navalha-session",phone);if(UI.c){UI.c.auth.pw="";UI.c.auth.pw2="";}}
function logout(){SESSION=null;try{localStorage.removeItem("navalha-session");}catch(e){}}

/* ================= regras de agenda ================= */
const windowsFor=(bid,k)=>{const b=barber(bid),wd=weekday(k);return((b&&b.hours)?b.hours[wd]:S.hours[wd])||[];};
const apptsOf=(bid,k)=>S.appointments.filter(a=>a.barberId===bid&&dayKey(a.startsAt)===k);
const blocksOn=(bid,k)=>{const s0=toUtc(k,0),s1=s0+864e5;return S.blocks.filter(x=>x.barberId===bid&&x.start<s1&&x.end>s0);};
const busyOf=(bid,k,ignoreId)=>[...apptsOf(bid,k).filter(a=>a.id!==ignoreId&&BLOCKING.has(a.status)).map(a=>[a.startsAt,a.endsAt]),...blocksOn(bid,k).map(x=>[x.start,x.end])];
const overlapLen=(s,e,ints)=>ints.reduce((t,[a,b])=>t+Math.max(0,Math.min(e,b)-Math.max(s,a)),0);
function freeSlots(k,bid,dur,opt={}){const out=[],now=Date.now(),busy=busyOf(bid,k,opt.ignoreId);
  for(const[o,c]of windowsFor(bid,k))for(let m=o;m+dur<=c;m+=STEP){const s=toUtc(k,m),e=s+dur*60000;
    if(!opt.ignoreNow&&s<=now)continue;if(!busy.some(([a,b])=>s<b&&e>a))out.push(s);}return out;}

function seedReminders(rnd){const now=Date.now(),t=dayKey(now);
  for(const a of S.appointments){const d=dayKey(a.startsAt);let sentAt=toUtc(addDays(d,-1),960+Math.floor(rnd()*150));

    if(sentAt>now||sentAt<a.createdAt)continue;const x=rnd();let reply=null;
    if(a.status==="no_show")reply=x<.15?"confirmed":null;else if(a.status==="canceled")reply=x<.5?"reschedule":x<.7?"confirmed":null;
    else if(a.status==="completed")reply=x<.78?"confirmed":x<.8?"reschedule":null;else reply=x<.4?"confirmed":x<.46?"reschedule":null;
    a.reminder={sentAt,channel:"manual",reply,repliedAt:reply?Math.min(now,sentAt+(4+rnd()*200)*60000):null};}}

function periodRange(days,offset=0){const end=addDays(today(),-offset*days);return{start:addDays(end,-(days-1)),end};}
function metrics(f){const{start,end}=periodRange(f.days,f.offset||0),now=Date.now(),wdF=f.weekday===""||f.weekday==null?null:+f.weekday;
  const inScope=a=>{const k=dayKey(a.startsAt);return k>=start&&k<=end&&a.startsAt<=now&&(!f.barberId||a.barberId===f.barberId)&&(!f.serviceId||a.serviceId===f.serviceId)&&(wdF===null||weekday(k)===wdF);};
  const list=S.appointments.filter(inScope),done=list.filter(a=>a.status==="completed");
  const fat=done.reduce((s,a)=>s+a.price,0),comm=done.reduce((s,a)=>s+Math.round(a.price*(a.commissionPct||0)/100),0);
  const nc=list.filter(a=>a.status!=="canceled"),ns=nc.length?list.filter(a=>a.status==="no_show").length/nc.length:0;
  const bs=f.barberId?[f.barberId]:activeBarbers().map(b=>b.id);let open=0;
  for(let i=0;i<f.days;i++){const k=addDays(start,i);if(wdF!==null&&weekday(k)!==wdF)continue;
    for(const bid of bs){const bl=blocksOn(bid,k).map(x=>[x.start,x.end]);for(const[o,c]of windowsFor(bid,k)){const s=toUtc(k,o),e=Math.min(toUtc(k,c),now);if(e>s)open+=(e-s-overlapLen(s,e,bl))/60000;}}}
  const busy=list.filter(a=>BLOCKING.has(a.status)).reduce((s,a)=>s+(Math.min(a.endsAt,now)-a.startsAt)/60000,0);
  const shopLevel=!f.barberId&&!f.serviceId&&wdF===null;
  const exp=shopLevel?S.expenses.filter(e=>e.date>=start&&e.date<=end):null,expT=exp?exp.reduce((s,e)=>s+e.amount,0):null;
  const uniq=new Set(done.map(a=>a.clientPhone)),startMs=toUtc(start,0);
  const novos=[...uniq].filter(p=>(S.clients[cidOf(p)]||{}).createdAt>=startMs).length;
  return{start,end,list,done,fat,comm,exp,expT,profit:expT===null?null:fat-comm-expT,ticket:done.length?Math.round(fat/done.length):0,ns,occ:open?Math.min(1,busy/open):0,clients:uniq.size,novos};}
function delta(cur,prev){if(!prev)return `<span class="delta flat">sem base</span>`;const d=(cur-prev)/prev;const c=Math.abs(d)<.02?"flat":d>0?"up":"down";return `<span class="delta ${c}">${d>0?"▲":d<0?"▼":"■"} ${pct(Math.abs(d))} vs período anterior</span>`;}

      <dl class="dl"><dt>Serviço</dt><dd>${esc(a.serviceName)} · <span class="mono" style="color:var(--gold)">${brl(a.price)}</span></dd><dt>Barbeiro</dt><dd>${esc(a.barberName)}</dd>
      <dt>Nome</dt><dd>${esc(a.clientName)}</dd><dt>WhatsApp</dt><dd class="mono">${fmtPhone(a.clientPhone)}</dd><dt>Endereço</dt><dd>${esc(S.shop.address)} · <a href="${mapsUrl()}" target="_blank" rel="noopener" style="color:var(--gold)">ver no mapa</a></dd></dl>
      <p class="note">Na véspera a barbearia te manda um lembrete no WhatsApp. Precisa mudar? Use <b>Meu perfil</b>, até ${S.settings.cancelMinHours}h antes.</p></div>
    ${sessionClient()?"":`<div class="card row between" style="margin-top:16px;border-color:rgba(240,189,79,.35)"><div><b>Crie uma senha</b><div class="muted" style="font-size:13px">Para remarcar, cancelar e ver seu histórico quando quiser.</div></div><button class="btn gold sm" data-act="c-signup">Criar senha</button></div>`}
    <div class="row" style="margin-top:16px"><button class="btn" data-act="c-new">Novo agendamento</button><button class="btn ghost" data-act="c-mine">Meu perfil</button><button class="btn ghost" data-act="c-see">Ver como barbeiro</button></div>`;}
  const labels=["Serviço","Barbeiro","Horário","Seus dados"];
  const prog=`<div class="progress" aria-hidden="true">${labels.map((l,i)=>`<div class="${i<=c.step?"on":""}"><span></span>${l}</div>`).join("")}</div>`;
  let body="";
  if(c.step===0)body=`<h2>Escolha o serviço</h2><div class="choices stagger">${S.services.filter(s=>s.active).map((s,i)=>`<button class="choice" style="--i:${i}" data-act="c-service" data-id="${s.id}" aria-pressed="${s.id===c.serviceId}"><b>${esc(s.name)}</b><span class="price">${brl(s.price)}</span><span class="muted">${s.durationMin} min</span></button>`).join("")}</div>`;
  else if(c.step===1){const n3=bid=>[0,1,2].reduce((s,d)=>s+(bid==="any"?anySlots(addDays(t,d),sv.durationMin):freeSlots(addDays(t,d),bid,sv.durationMin)).length,0);
    const firstAny=(()=>{for(let i=0;i<14;i++){const s=anySlots(addDays(t,i),sv.durationMin);if(s.length)return s[0];}return null;})();
    body=`<h2>Com quem?</h2><div class="choices stagger"><button class="choice" style="--i:0" data-act="c-barber" data-id="any" aria-pressed="${c.barberId==="any"}"><span class="avatar" style="background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1B1203">★</span><b>Qualquer um</b><span class="muted">${firstAny?"mais cedo: "+(dayKey(firstAny)===t?"hoje":shortDay(dayKey(firstAny)))+" "+hhmm(localMin(firstAny)):"sem horários"}</span></button>
      ${activeBarbers().map((b,i)=>`<button class="choice" style="--i:${i+1}" data-act="c-barber" data-id="${b.id}" aria-pressed="${b.id===c.barberId}"><span class="avatar">${initial(b.name)}</span><b>${esc(b.name)}</b><span class="muted">${n3(b.id)} horários nos próximos 3 dias</span></button>`).join("")}</div>`;}
  else if(c.step===2){if(!c.day)c.day=firstDayWith(d=>c.barberId==="any"?anySlots(d,sv.durationMin):freeSlots(d,c.barberId,sv.durationMin));

      <label class="f" style="flex:1 1 220px">Nome<input class="i" id="c-name" autocomplete="name" value="${esc(c.name)}" placeholder="Como te chamamos"></label>
      <label class="f" style="flex:1 1 220px">WhatsApp<input class="i" id="c-phone" inputmode="tel" autocomplete="tel" value="${esc(c.phone)}" placeholder="(62) 99999-1234"></label></div>
      <label class="check-row"><input type="checkbox" id="c-consent" ${c.consent?"checked":""}><span>Aceito receber o lembrete deste horário pelo WhatsApp e concordo com a política de privacidade.</span></label>
      <label class="check-row"><input type="checkbox" id="c-remember" ${c.remember?"checked":""}><span>Lembrar meu nome e telefone neste aparelho</span></label>
      <details class="priv"><summary>Política de privacidade (resumo)</summary><p>A ${esc(S.shop.name)} guarda seu nome, telefone e histórico de atendimentos para organizar a agenda e enviar lembretes. Os dados não são vendidos nem compartilhados. Você pode apagar seus dados a qualquer momento em <b>Meu perfil</b>.</p></details>
      <p class="muted" style="font-size:13px;margin:0">Já tem senha? <button type="button" class="btn ghost sm" data-act="c-tab" data-id="mine">Entrar</button> e seus dados são preenchidos sozinhos.</p>`}
      ${c.error?`<p class="err" role="alert">${esc(c.error)}</p>`:""}<div class="row"><button class="btn gold" type="submit">Confirmar agendamento</button></div></form>`;}
  return `${prog}<div class="stack">${body}${c.step>0?`<div class="row"><button class="btn ghost sm" data-act="c-back">← Voltar</button>${c.step===2&&c.start?`<button class="btn" data-act="c-next">Continuar →</button>`:""}</div>`:""}</div>`;}

    <p class="muted" style="font-size:12px;margin:0">Para agendar não precisa de senha. Ela serve para ver seus horários, histórico e preferências.</p></form>`;}
function renderPerfil(){const my=UI.c.my,now=Date.now(),cl=sessionClient(),p=cl.phone;
  const mine=S.appointments.filter(a=>a.clientPhone===p);
  const up=mine.filter(a=>a.status==="scheduled"&&a.startsAt>now).sort((a,b)=>a.startsAt-b.startsAt);

  const hist=mine.filter(a=>a.startsAt<=now&&a.status!=="canceled").sort((a,b)=>b.startsAt-a.startsAt).slice(0,8);
  const top=k=>Object.entries(done.reduce((m,a)=>(m[a[k]]=(m[a[k]]||0)+1,m),{})).sort((x,y)=>y[1]-x[1])[0];

      <p class="note">A troca é feita de uma vez: o horário antigo só é liberado quando o novo estiver garantido.</p></div>`;}
  return `<div class="stack">
    <div class="card row between"><div class="row" style="gap:14px"><span class="avatar" style="width:56px;height:56px;font-size:26px;margin:0">${initial(cl.name)}</span><div><span class="eyebrow">Meu perfil</span><h2>${esc(cl.name)}</h2><span class="muted mono" style="font-size:13px">${fmtPhone(p)} · cliente desde ${new Date(cl.createdAt).toLocaleDateString("pt-BR")}</span></div></div><button class="btn ghost sm" data-act="logout">Sair</button></div>
    <div class="kpis">${kpi("Visitas",done.length,"int",lastDays===null?"nenhuma ainda":lastDays===0?"última hoje":`última há ${lastDays} dias`,true)}${kpi("Investido no visual",spent,"brl","em atendimentos concluídos")}</div>
    ${favA?`<div class="card row between"><div><span class="eyebrow">Seu de sempre</span><div style="font-size:17px;font-weight:700">${esc(favS[0])} com ${esc(favB[0])}</div></div><button class="btn gold sm" data-act="my-repeat" data-id="${favA.id}">Agendar de novo</button></div>`:""}
    <h3>Próximos horários</h3>
    ${up.length?up.map(a=>{const can=canClientCancel(a),conf=my.confirmCancel===a.id,[,m,d]=dayKey(a.startsAt).split("-");
      return `<div class="card appt-card"><div class="date"><small>${WD[weekday(dayKey(a.startsAt))]}</small><b>${+d}</b><small>${MES[+m-1]}</small></div>

      <div class="stack"><form id="prof-form" class="card stack" novalidate><h3>Preferências</h3>
          <label class="f">Nome<input class="i" id="pf-name" value="${esc(cl.name)}"></label>

          <span class="muted" style="font-size:12px">O barbeiro vê esse recado na agenda, junto do seu horário.</span>
          ${my.profMsg?`<p class="note">${esc(my.profMsg)}</p>`:""}<button class="btn ghost sm" type="submit" style="align-self:flex-start">Salvar preferências</button></form>
        <form id="pw-form" class="card stack" novalidate><h3>Senha</h3>
          <div class="row" style="align-items:stretch"><label class="f" style="flex:1 1 150px">Senha atual<input class="i" type="password" id="pw-cur" autocomplete="current-password"></label><label class="f" style="flex:1 1 150px">Nova senha<input class="i" type="password" id="pw-new" autocomplete="new-password" placeholder="mínimo 8"></label></div>
          ${my.pwErr?`<p class="err" role="alert">${esc(my.pwErr)}</p>`:""}${my.pwMsg?`<p class="note">${esc(my.pwMsg)}</p>`:""}<button class="btn ghost sm" type="submit" style="align-self:flex-start">Trocar senha</button></form></div></div>
    <details class="priv card"><summary>Seus dados (LGPD)</summary><p>Guardamos nome, telefone, preferências e histórico de atendimentos${cl.consentAt?`, com consentimento dado em ${new Date(cl.consentAt).toLocaleDateString("pt-BR")}`:""}.</p>

        :`<div style="margin-top:10px"><button class="btn ghost sm" data-act="my-erase">Apagar meus dados</button></div>`}</details></div>`;}
function renderCliente(){const c=UI.c;return `<div class="client enter">${heroBlock()}
  <div class="client-nav"><div class="seg"><button data-act="c-tab" data-id="agendar" aria-pressed="${c.tab==="agendar"}">Agendar</button><button data-act="c-tab" data-id="mine" aria-pressed="${c.tab==="mine"}">${sessionClient()?esc(first(sessionClient().name))+" · perfil":"Meu perfil"}</button></div></div>
  ${c.tab==="agendar"?renderAgendar():sessionClient()?renderPerfil():renderAuth()}</div>`;}

/* ================= BARBEIRO ================= */
function freeGaps(bid,k){const out=[],now=Date.now(),busy=busyOf(bid,k).sort((a,b)=>a[0]-b[0]);
  for(const[o,c]of windowsFor(bid,k)){let cur=toUtc(k,o);const end=toUtc(k,c);for(const[a,b]of busy){if(b<=cur||a>=end)continue;if(a>cur)out.push([cur,a]);cur=Math.max(cur,b);}if(end>cur)out.push([cur,end]);}
  const stepMs=STEP*60000,nx=Math.ceil(now/stepMs)*stepMs;return out.map(([s,e])=>[s<now?nx:s,e]).filter(([s,e])=>e-s>=30*60000);}
function apptActions(a){if(a.status==="scheduled")return `<button class="mini ok" data-act="st" data-id="${a.id}" data-s="completed">✓ Concluído</button><button class="mini warn" data-act="st" data-id="${a.id}" data-s="no_show">Não veio</button><button class="mini off" data-act="st" data-id="${a.id}" data-s="canceled">Cancelar</button>`;return `<span class="pill ${a.status}">${STATUS_PT[a.status]}</span>`;}
const seesMoney=()=>S.settings.barberSeesRevenue;
function renderBarbeiroAgenda(){const B=UI.b,me=barber(B.me),k=B.day,t=today(),now=Date.now(),money=seesMoney();
  const mine=apptsOf(me.id,k).sort((a,b)=>a.startsAt-b.startsAt);
  const nextA=S.appointments.filter(a=>a.barberId===me.id&&a.status==="scheduled"&&a.endsAt>now).sort((a,b)=>a.startsAt-b.startsAt)[0];
  const ws=addDays(t,-weekday(t)),week=[...Array(7)].map((_,i)=>addDays(ws,i));
  const load=d=>{let open=0;const bl=blocksOn(me.id,d).map(x=>[x.start,x.end]);for(const[o,c]of windowsFor(me.id,d)){const s=toUtc(d,o),e=toUtc(d,c);open+=(e-s-overlapLen(s,e,bl))/60000;}
    const busy=apptsOf(me.id,d).filter(a=>BLOCKING.has(a.status)).reduce((s,a)=>s+(a.endsAt-a.startsAt)/60000,0);return open?Math.min(1,busy/open):0;};
  const blocks=blocksOn(me.id,k).map(x=>({t:Math.max(x.start,toUtc(k,0)),blk:x}));
  const items=[...mine.map(a=>({t:a.startsAt,a})),...freeGaps(me.id,k).map(([s,e])=>({t:s,free:[s,e]})),...blocks].sort((x,y)=>x.t-y.t);
  const comm=mine.filter(a=>a.status==="completed").reduce((s,a)=>s+Math.round(a.price*a.commissionPct/100),0),prevC=mine.filter(a=>a.status==="scheduled").reduce((s,a)=>s+Math.round(a.price*a.commissionPct/100),0);
  const closed=!windowsFor(me.id,k).length;
  return `<div class="stack enter">
    ${nextA?`<div class="next pulse"><div class="t mono">${hhmm(localMin(nextA.startsAt))}</div><div style="min-width:0"><span class="eyebrow">Próximo cliente${dayKey(nextA.startsAt)!==t?" · "+shortDay(dayKey(nextA.startsAt)):""}</span><div style="font-weight:800;font-size:18px">${esc(nextA.clientName)} ${rmBadge(nextA)}</div><div class="muted">${esc(nextA.serviceName)} · ${(nextA.endsAt-nextA.startsAt)/60000} min${(S.clients[cidOf(nextA.clientPhone)]||{}).notes?` · <span style="color:var(--gold)">tem anotação</span>`:""}</div></div></div>`:`<div class="next"><div class="muted">Nenhum cliente agendado pela frente.</div></div>`}
    <div class="week">${week.map(d=>{const[,,dd]=d.split("-"),n=apptsOf(me.id,d).filter(a=>a.status!=="canceled").length,off=!windowsFor(me.id,d).length||blocksOn(me.id,d).some(x=>x.start<=toUtc(d,0)&&x.end>=toUtc(addDays(d,1),0));
      return `<button class="wday" data-act="b-day" data-id="${d}" aria-pressed="${d===k}"><small>${d===t?"hoje":WD[weekday(d)]}</small><b>${+dd}</b><small>${off?"folga":n+'<span class="lbl"> '+(n===1?"cliente":"clientes")+"</span>"}</small><div class="bar"><i style="width:${Math.round(load(d)*100)}%"></i></div></button>`;}).join("")}</div>
    <div class="row between"><div class="row"><button class="btn ghost sm" data-act="b-shift" data-id="-1" aria-label="Dia anterior">←</button><button class="btn ghost sm" data-act="b-today">Hoje</button><button class="btn ghost sm" data-act="b-shift" data-id="1" aria-label="Próximo dia">→</button><h3 style="margin-left:6px">${esc(fmtDay(k))}</h3></div>
      <div class="row"><span class="mono muted" style="font-size:13px">comissão <b style="color:var(--ok)">${brl(comm)}</b> · prevista <b style="color:var(--gold)">${brl(prevC)}</b></span>${closed?"":`<button class="btn ghost sm" data-act="b-quickblock">Bloquear horário</button>`}</div></div>

function heatmap(f){const{start}=periodRange(f.days),list=metrics({...f,weekday:""}).list.filter(a=>a.status!=="canceled");
  const hours=[];for(let h=8;h<20;h++)hours.push(h);const dcount=[0,0,0,0,0,0,0];for(let i=0;i<f.days;i++)dcount[weekday(addDays(start,i))]++;
  const grid=[...Array(7)].map(()=>hours.map(()=>0));for(const a of list){const h=Math.floor(localMin(a.startsAt)/60);if(h<8||h>=20)continue;grid[weekday(dayKey(a.startsAt))][h-8]++;}
  const avg=grid.map((r,d)=>r.map(v=>dcount[d]?v/dcount[d]:0)),mx=Math.max(.01,...avg.flat());const rows=[0,1,2,3,4,5].filter(d=>avg[d].some(v=>v>0)||d<6);
  const color=v=>{if(v<=0)return "rgba(255,255,255,.03)";const t=v/mx;return t<.5?`rgba(224,38,47,${.15+t*1.3})`:`color-mix(in srgb,var(--gold) ${Math.round((t-.5)*200)}%,var(--red))`;};
  let best=null,worst=null;rows.forEach(d=>hours.forEach((h,i)=>{const v=avg[d][i];const open=activeBarbers().some(b=>windowsFor(b.id,addDays(start,(d-weekday(start)+7)%7)).some(([o,c])=>o<=h*60&&c>h*60));if(!open)return;if(!best||v>best.v)best={d,h,v};if(!worst||v<worst.v)worst={d,h,v};}));
  return `<div class="heat" style="grid-template-columns:38px repeat(${hours.length},minmax(0,1fr))"><span></span>${hours.map(h=>`<span class="h">${h}h</span>`).join("")}
    ${rows.map(d=>`<span class="d">${WD[d]}</span>${hours.map((h,i)=>`<span class="c" style="background:${color(avg[d][i])}" title="${WD_LONG[d]} ${h}h: ${avg[d][i].toFixed(1).replace(".",",")} clientes em média">${avg[d][i]>=.5?avg[d][i].toFixed(1).replace(".",","):""}</span>`).join("")}`).join("")}</div>
    <div class="heat-scale"><span>vazio</span><i></i><span>cheio</span><span style="margin-left:auto">clientes por hora, média do período</span></div>
    ${best?`<p class="note" style="margin-top:10px">Pico: <b>${WD_LONG[best.d]} às ${best.h}h</b>. Mais vazio: <b>${WD_LONG[worst.d]} às ${worst.h}h</b>, um bom horário para promoção.</p>`:""}`;}

      ${kpi("Faturamento",M.fat,"brl",delta(M.fat,P.fat),M.profit===null)}${kpi("Comissões",M.comm,"brl","a pagar aos barbeiros")}${M.expT!==null?kpi("Gastos",M.expT,"brl",`${M.exp.length} lançamentos`):""}
      ${kpi("Atendimentos",M.done.length,"int",delta(M.done.length,P.done.length))}${kpi("Ticket médio",M.ticket,"brl",delta(M.ticket,P.ticket))}${kpi("Ocupação",M.occ*100,"pct","atendido ou agendado ÷ aberto")}${kpi("Não veio",M.ns*100,"pct","",false,M.ns>.1?"var(--warn)":"")}${kpi("Clientes",M.clients,"int",`${M.novos} ${M.novos===1?"novo":"novos"}`)}</div>
    <div class="two"><div class="card chart"><h3>Faturamento por dia</h3><p class="muted" style="margin:2px 0 12px;font-size:13px">Em reais · sábados em dourado</p>
        <svg viewBox="0 0 ${W} ${Hc+4}" role="img" aria-label="Faturamento por dia"><defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0262F"/><stop offset="1" stop-color="#8C0F16"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0BD4F"/><stop offset="1" stop-color="#A8761E"/></linearGradient></defs>${axis}${bars}</svg></div>
      <div class="card stack"><h3>Horários de pico</h3>${heatmap(f)}</div></div>
    <div class="two"><div class="card stack"><h3>Serviços</h3>${rk.map(([n,o])=>`<div><div class="row between" style="font-size:14px;margin-bottom:5px"><span><b>${esc(n)}</b> <span class="muted">· ${o.n}</span></span><span class="mono" style="color:var(--gold)">${brl(o.v)}</span></div><div class="meter"><i style="width:${Math.round(o.v/rmax*100)}%"></i></div></div>`).join("")||`<p class="muted">Nada concluído.</p>`}</div>
      <div class="card stack"><h3>Por barbeiro</h3><div class="tbl-wrap"><table><thead><tr><th>Barbeiro</th><th class="num">Atend.</th><th class="num">Faturado</th><th class="num">Comissão</th></tr></thead><tbody>${byB.map(x=>`<tr><td>${esc(x.b.name)} <span class="muted">${x.b.commissionPct}%</span></td><td class="num mono">${x.n}</td><td class="num mono">${brl(x.fat)}</td><td class="num mono" style="color:var(--ok)">${brl(x.comm)}</td></tr>`).join("")}</tbody></table></div></div></div>

  const nsRate=l=>{const v=l.filter(a=>a.status!=="canceled");return v.length?v.filter(a=>a.status==="no_show").length/v.length:0;};const nsC=nsRate(conf),nsN=nsRate(none),mult=nsC>0?nsN/nsC:0;
  const pend=S.appointments.filter(a=>inQueueWindow(a)&&!a.reminder&&(!barberId||a.barberId===barberId)).length,wait=S.appointments.filter(a=>inQueueWindow(a)&&a.reminder&&!a.reminder.reply&&(!barberId||a.barberId===barberId)).length;

function parseHours(txt){const out=[];for(const p of(String(txt).trim()?String(txt).split(","):[])){const m=p.trim().match(/^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/);if(!m)return null;const o=parseHM(m[1]),c=parseHM(m[2]);if(o===null||c===null||c<=o)return null;out.push([o,c]);}return out.sort((a,b)=>a[0]-b[0]);}

/* ================= render ================= */
function countUp(){if(reduce)return;document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,fmt=el.dataset.fmt,t0=performance.now(),d=700;
  const f=v=>fmt==="brl"?brl(Math.round(v)):fmt==="pct"?v.toFixed(1).replace(".",",")+"%":String(Math.round(v));
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);});}
function moveThumb(){const b=$(`#r-${UI.role}`),th=$("#thumb");th.style.left=b.offsetLeft+"px";th.style.width=b.offsetWidth+"px";}
function render(anim){["cliente","barbeiro","gerente"].forEach(r=>$(`#r-${r}`).setAttribute("aria-pressed",UI.role===r));moveThumb();$("#shop-name-top").textContent=S.shop.name;
  const app=$("#app");app.innerHTML=UI.role==="cliente"?renderCliente():UI.role==="barbeiro"?renderBarbeiro():renderGerente();
  if(!anim)app.querySelectorAll(".enter,.stagger").forEach(e=>{e.classList.remove("enter");e.classList.remove("stagger");});else countUp();
  const sel=app.querySelector('.tabs [aria-selected="true"]');if(sel){const tb=sel.parentElement;tb.scrollLeft=Math.max(0,sel.offsetLeft-tb.clientWidth/2+sel.offsetWidth/2);}renderLayer();}
function setRole(r){UI.role=r;UI.open=null;UI.client=null;UI.hoursEdit=null;UI.manual=null;try{history.replaceState(null,"","#"+r);}catch(e){}render(true);window.scrollTo(0,0);}
const closeLayer=()=>{UI.open=null;UI.client=null;UI.hoursEdit=null;if(UI.manual&&!UI.manual.inline)UI.manual=null;};

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;if(e.target.closest("[data-stop]")&&el.classList.contains("drawer-bg"))return;

      const sv=S.services.find(x=>x.id===UI.manual.serviceId);if(!freeSlots(UI.manual.day,B.me,sv.durationMin).includes(s)){const fit=S.services.filter(x=>x.active).sort((a,b)=>b.durationMin-a.durationMin).find(x=>freeSlots(UI.manual.day,B.me,x.durationMin).includes(s));if(fit)UI.manual.serviceId=fit.id;}break;}

    case"g-today":G.day=today();anim=true;break;

    case"g-days":G.f.days=+id;anim=true;break;
    case"f-clear":G.f={days:G.f.days,barberId:"",serviceId:"",weekday:""};anim=true;break;
    case"g-member":B.me=id;B.tab="historico";B.period=G.f.days;return setRole("barbeiro");

document.addEventListener("input",e=>{const t=e.target;

    else if(f.type==="day"){s=toUtc(f.day,0);en=toUtc(addDays(f.day,1),0);}
    else{f.until=$("#blk-until").value||f.day;if(f.until<f.day){B.blkMsg="A data final precisa ser depois da inicial.";render(false);return;}s=toUtc(f.day,0);en=toUtc(addDays(f.until,1),0);}
    if(en<=Date.now()){B.blkMsg="Esse período já passou.";render(false);return;}
    S.blocks.push({id:uid(),barberId:B.me,start:s,end:en,reason:f.reason,createdAt:Date.now()});save();
    const hit=S.appointments.filter(a=>a.barberId===B.me&&a.status==="scheduled"&&a.startsAt<en&&a.endsAt>s).sort((a,b)=>a.startsAt-b.startsAt);
    B.blkMsg=hit.length?`<b>Bloqueio criado.</b> ${hit.length} ${hit.length===1?"cliente já estava marcado":"clientes já estavam marcados"} nesse período: ${hit.map(a=>`<a href="${waUrl(a.clientPhone,`Oi, ${first(a.clientName)}! Aqui é o ${barber(B.me).name}, da ${S.shop.name}. Tive um imprevisto e não vou poder te atender ${fmtDay(dayKey(a.startsAt))} às ${hhmm(localMin(a.startsAt))}. Podemos remarcar? navalha.app/${S.shop.slug}`)}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(first(a.clientName))} ${hhmm(localMin(a.startsAt))}</a>`).join(", ")}. Toque no nome para avisar pelo WhatsApp.`:"";
    toast("Bloqueio criado");render(false);}
  else if(id==="he-form"){const b=barber(UI.hoursEdit),h={};for(let i=0;i<7;i++){const v=parseHours($("#he-"+i).value);if(v===null){toast(`Formato inválido em ${WD_LONG[i]}`);return;}h[i]=v;}b.hours=h;save();UI.hoursEdit=null;toast(`Horário de ${b.name} salvo`);render(false);}
  else if(id==="e-form"){const v=Math.round(parseFloat($("#e-val").value.replace(/\./g,"").replace(",","."))*100),d=$("#e-desc").value.trim();
    if(!d||!(v>0)){toast("Preencha descrição e um valor maior que zero");return;}S.expenses.push({id:uid(),description:d,amount:v,category:$("#e-cat").value,date:$("#e-date").value||today()});save();render(false);toast("Gasto lançado");}});
document.addEventListener("change",e=>{const t=e.target,m=UI.manual,G=UI.g;
  if(m&&["m-barber","m-service","m-day","m-start"].includes(t.id)){m.name=$("#m-name").value;m.phone=$("#m-phone").value;if(t.id==="m-barber")m.barberId=t.value;if(t.id==="m-service")m.serviceId=t.value;if(t.id==="m-day")m.day=t.value||today();if(t.id==="m-start")m.start=+t.value;m.error="";render(false);return;}
  if(t.id==="f-days"){G.f.days=+t.value;render(true);return;}if(t.id==="f-barber"){G.f.barberId=t.value;render(true);return;}if(t.id==="f-service"){G.f.serviceId=t.value;render(true);return;}if(t.id==="f-wd"){G.f.weekday=t.value;render(true);return;}
  if(t.id==="cl-notes"){const cl=S.clients[cidOf(t.dataset.phone)];if(cl){cl.notes=t.value.trim();save();toast("Anotação salva");}return;}
  if(t.id==="he-house"){const b=barber(UI.hoursEdit);if(t.checked){b.hours=null;save();toast(`${b.name} usa o horário da casa`);}else{b.hours=JSON.parse(JSON.stringify(S.hours));save();}render(false);return;}
  if(t.id==="st-cancel"){S.settings.cancelMinHours=+t.value;save();toast("Regra salva");return;}
  if(t.id==="st-inactive"){S.settings.inactiveDays=+t.value;save();toast("Regra salva");return;}
  if(t.id==="st-money"){S.settings.barberSeesRevenue=t.checked;save();toast(t.checked?"Barbeiros veem o faturamento":"Barbeiros veem só a comissão");return;}
  if(t.dataset.cf){if(t.dataset.cf==="whatsapp"){const p=normalizePhone(t.value);if(!p){toast("WhatsApp inválido");render(false);return;}S.shop.whatsapp=p;}else S.shop[t.dataset.cf]=t.value.trim()||S.shop[t.dataset.cf];save();render(false);toast("Dados da barbearia salvos");}
  if(t.dataset.sv){const s=S.services.find(x=>x.id===t.dataset.sv),f=t.dataset.f;if(f==="name")s.name=t.value.trim()||s.name;if(f==="price"){const v=Math.round(parseFloat(t.value.replace(",","."))*100);if(v>0)s.price=v;}if(f==="durationMin"){const v=parseInt(t.value,10);if(v>=5&&v<=480)s.durationMin=v;}if(f==="active")s.active=t.checked;save();render(false);toast("Serviço salvo");}
  if(t.dataset.bb){const b=barber(t.dataset.bb),f=t.dataset.f;if(f==="name")b.name=t.value.trim()||b.name;else if(f==="commissionPct"){const v=parseInt(t.value,10);if(v>=0&&v<=100)b.commissionPct=v;else toast("Comissão entre 0 e 100");}else b.active=t.checked;
    if(!S.barbers.some(x=>x.active)){b.active=true;toast("Precisa haver ao menos um barbeiro ativo");}save();render(false);}
  if(t.dataset.hr!==undefined){const v=parseHours(t.value);if(v===null){toast(`Formato inválido em ${WD_LONG[t.dataset.hr]}`);render(false);return;}S.hours[t.dataset.hr]=v;save();render(false);toast("Horário salvo");}});

/* ================= início ================= */
if(!S||!S.blocks||!S.settings){seed();save();}
UI.c=freshClient();
render(true);
</script>
